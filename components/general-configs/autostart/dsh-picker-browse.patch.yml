# O Harness roda como servico SYSTEM (sessao 0); o seletor nativo do Windows
# abriria uma janela invisivel. Fixa o par browse (backend + interface),
# que abre a selecao de diretorio dentro do proprio app.
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-browse-host
      name: "@deepseek-ai/dsh-host-directory-picker-browse"
    - id: directory-picker-browse-client
      name: "@deepseek-ai/dsh-client-ui-directory-picker-browse"
